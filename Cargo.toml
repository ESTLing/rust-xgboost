[package]
name = "xgboost-rs"
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust bindings for the XGBoost gradient boosting library"
readme = "README.md"
edition.workspace = true

[workspace]
members = [".", "xgboost-sys"]

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/ESTLing/rust-xgboost"

[dependencies]
xgboost-sys = { package = "xgboost_lib-sys", path = "xgboost-sys", version = "0.1.0" }
libc = "0.2"
log = "0.4"
tempfile = "3.15"
serde_json = "1.0"

[features]
default = []

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
