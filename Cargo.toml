[package]
name = "xgb"
version.workspace = true
authors = ["Dave Challis <dave@suicas.net>", "Marco Mengelkoch"]
license.workspace = true
repository.workspace = true
homepage = "https://github.com/marcomq/rust-xgboost"
description = "Rust bindings for the XGBoost gradient boosting library"
documentation = "https://docs.rs/xgb"
readme = "README.md"
edition.workspace = true

[workspace]
members = [".", "xgboost-sys"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/marcomq/rust-xgboost"

[dependencies]
xgboost-sys = { package = "xgboost_lib-sys", path = "xgboost-sys", version = "0.1.0" }
libc = "0.2"
log = "0.4"
tempfile = "3.15"

[features]
default = []

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
